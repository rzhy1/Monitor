name: Monitor Zhejiang Tender Notices

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monitor.yml'
      - 'url_state.json'
  schedule:
    # UTC 23:00、00:00-13:00，对应北京时间 07:00-21:00，每小时检查一次
    - cron: '0 23,0-13 * * *'

permissions:
  contents: write

concurrency:
  group: zhejiang-tender-monitor
  cancel-in-progress: false

jobs:
  check_url_changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WEBHOOK_URLS: ${{ secrets.WEBHOOK_URLS }}
      PYTHONUNBUFFERED: '1'
      CHECK_URLS: |
        https://ggzy.zj.gov.cn/jyxxgk/list.html?catenum=002001011
        https://ggzy.zj.gov.cn/jyxxgk/list.html?catenum=002001001
        https://ggzy.zj.gov.cn/jyxxgk/list.html?catenum=002001003
        https://ggzy.zj.gov.cn/jyxxgk/list.html?catenum=002001004
        https://ggzy.zj.gov.cn/jyxxgk/list.html?catenum=002001005
      URL_DESCRIPTIONS: |
        {
          "https://ggzy.zj.gov.cn/jyxxgk/list.html?catenum=002001011": "浙江-招标文件公示",
          "https://ggzy.zj.gov.cn/jyxxgk/list.html?catenum=002001001": "浙江-招标公告",
          "https://ggzy.zj.gov.cn/jyxxgk/list.html?catenum=002001003": "浙江-开标结果公示",
          "https://ggzy.zj.gov.cn/jyxxgk/list.html?catenum=002001004": "浙江-中标候选人公示",
          "https://ggzy.zj.gov.cn/jyxxgk/list.html?catenum=002001005": "浙江-中标结果公告"
        }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Check and notify
        id: monitor
        run: |
          python - <<'PY'
          import hashlib
          import html
          import json
          import os
          import re
          import sys
          import time
          from datetime import datetime, timedelta
          from pathlib import Path
          from urllib.parse import urljoin
          from zoneinfo import ZoneInfo

          import requests

          BASE_URL = "https://ggzy.zj.gov.cn"
          API_URL = f"{BASE_URL}/inteligentsearch/rest/esinteligentsearch/getFullTextDataNew"
          STATE_FILE = Path("url_state.json")
          KEYWORD = "杭州市城市轨道交通"
          PAGE_SIZE = 16
          MAX_PAGES = 200
          REQUEST_TIMEOUT = (15, 35)
          SHANGHAI_TZ = ZoneInfo("Asia/Shanghai")

          USER_AGENT = (
              "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
              "(KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          )

          API_HEADERS = {
              "Accept": "application/json, text/javascript, */*; q=0.01",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
              "Content-Type": "application/json;charset=UTF-8",
              "Origin": BASE_URL,
              "User-Agent": USER_AGENT,
              "X-Requested-With": "XMLHttpRequest",
          }


          class Monitor:
              def __init__(self):
                  raw_urls = os.getenv("CHECK_URLS", "")
                  self.check_urls = [line.strip() for line in raw_urls.splitlines() if line.strip()]
                  if not self.check_urls:
                      raise RuntimeError("CHECK_URLS 未配置或为空")

                  self.url_descriptions = json.loads(os.getenv("URL_DESCRIPTIONS", "{}"))
                  self.webhooks = self.load_webhooks()
                  self.session = requests.Session()
                  self.session.headers.update(API_HEADERS)

              @staticmethod
              def load_webhooks():
                  raw = os.getenv("WEBHOOK_URLS", "").strip()
                  if not raw:
                      print("[WARN] 未设置 WEBHOOK_URLS；发现新增项目时将无法发送通知")
                      return []
                  try:
                      value = json.loads(raw)
                  except json.JSONDecodeError as exc:
                      raise RuntimeError(f"WEBHOOK_URLS 不是合法 JSON：{exc}") from exc

                  if not isinstance(value, list):
                      raise RuntimeError("WEBHOOK_URLS 必须是 JSON 数组")

                  urls = []
                  for item in value:
                      if not isinstance(item, dict) or not isinstance(item.get("url"), str):
                          raise RuntimeError("WEBHOOK_URLS 每项必须是包含 url 字段的对象")
                      webhook = item["url"].strip()
                      if not webhook.startswith("https://"):
                          raise RuntimeError("企业微信 Webhook 必须使用 HTTPS")
                      urls.append(webhook)
                  return urls

              @staticmethod
              def record_key(record):
                  return record.get("url") or record.get("title", "").strip()

              def load_state(self):
                  if not STATE_FILE.exists():
                      return {}
                  try:
                      with STATE_FILE.open("r", encoding="utf-8") as file:
                          state = json.load(file)
                      if not isinstance(state, dict):
                          raise ValueError("状态文件顶层必须是 JSON 对象")
                      return state
                  except (json.JSONDecodeError, OSError, ValueError) as exc:
                      raise RuntimeError(f"读取 {STATE_FILE} 失败：{exc}") from exc

              def save_state(self, state):
                  temp_file = STATE_FILE.with_suffix(".json.tmp")
                  with temp_file.open("w", encoding="utf-8", newline="\n") as file:
                      json.dump(state, file, ensure_ascii=False, indent=2)
                      file.write("\n")
                  temp_file.replace(STATE_FILE)

              @staticmethod
              def clean_text(value):
                  value = html.unescape(str(value or ""))
                  value = re.sub(r"<[^>]+>", " ", value)
                  return re.sub(r"\s+", " ", value).strip()

              @staticmethod
              def get_total_count(result):
                  for key in ("totalcount", "totalCount", "total", "count"):
                      value = result.get(key)
                      if value is not None:
                          try:
                              return int(value)
                          except (TypeError, ValueError):
                              pass
                  return None

              def parse_response(self, data, source_url, page_number):
                  if not isinstance(data, dict):
                      raise ValueError("接口 JSON 顶层不是对象")
                  result = data.get("result")
                  if not isinstance(result, dict):
                      preview = json.dumps(data, ensure_ascii=False)[:500]
                      raise ValueError(f"接口 JSON 缺少 result 对象：{preview}")
                  records = result.get("records")
                  if not isinstance(records, list):
                      preview = json.dumps(result, ensure_ascii=False)[:500]
                      raise ValueError(f"接口 JSON 的 result.records 不是数组：{preview}")

                  parsed = []
                  recognized_titles = 0
                  for index, item in enumerate(records):
                      if not isinstance(item, dict):
                          raise ValueError(f"第 {index + 1} 条记录不是对象")

                      raw_title = (
                          item.get("titlenew")
                          or item.get("title")
                          or item.get("infotitle")
                          or item.get("titletext")
                          or ""
                      )
                      title = self.clean_text(raw_title)
                      if not title:
                          continue
                      recognized_titles += 1
                      if KEYWORD not in title:
                          continue

                      raw_link = str(
                          item.get("linkurl")
                          or item.get("url")
                          or item.get("infourl")
                          or item.get("detailurl")
                          or ""
                      ).strip()
                      detail_url = urljoin(BASE_URL + "/", raw_link) if raw_link else ""
                      parsed.append({"title": title, "url": detail_url})

                  # 有返回记录却无法识别标题字段时必须报错，避免误把解析失败当作零条结果。
                  if records and recognized_titles == 0:
                      keys = sorted({str(key) for item in records[:3] if isinstance(item, dict) for key in item})
                      raise ValueError(
                          f"第 {page_number} 页记录中找不到已知标题字段；样例字段：{keys}"
                      )

                  return records, parsed

              def build_payload(self, category_num, offset, start_time, end_time):
                  # categorynum 必须取当前栏目 URL 的 catenum，不能使用复制示例中的 002001008。
                  return {
                      "token": "",
                      "pn": offset,
                      "rn": PAGE_SIZE,
                      "sdt": "",
                      "edt": "",
                      "wd": "",
                      "inc_wd": "",
                      "exc_wd": "",
                      "fields": "title",
                      "cnum": "001",
                      "sort": json.dumps({"webdate": "0"}, ensure_ascii=False),
                      "ssort": "title",
                      "cl": 200,
                      "terminal": "",
                      "condition": [
                          {
                              "fieldName": "categorynum",
                              "isLike": True,
                              "likeType": 2,
                              "equal": category_num,
                          },
                          {
                              "fieldName": "infoc",
                              "isLike": True,
                              "likeType": 2,
                              "equal": "33",
                          },
                      ],
                      "time": [
                          {
                              "fieldName": "webdate",
                              "startTime": start_time,
                              "endTime": end_time,
                          }
                      ],
                      "highlights": "",
                      "statistics": None,
                      "unionCondition": None,
                      "accuracy": "",
                      "noParticiple": "0",
                      "searchRange": None,
                      "isBusiness": "1",
                  }

              def post_api(self, payload, referer):
                  headers = {"Referer": referer}
                  last_error = None
                  for attempt in range(1, 4):
                      try:
                          response = self.session.post(
                              API_URL,
                              json=payload,
                              headers=headers,
                              timeout=REQUEST_TIMEOUT,
                          )
                          if response.status_code in (429, 500, 502, 503, 504) and attempt < 3:
                              print(
                                  f"[WARN] 接口 HTTP {response.status_code}，"
                                  f"{attempt}/3 次请求失败，稍后重试"
                              )
                              time.sleep(attempt * 2)
                              continue

                          if response.status_code != 200:
                              preview = response.text[:500].replace("\n", " ")
                              raise RuntimeError(
                                  f"接口 HTTP {response.status_code}；"
                                  f"Content-Type={response.headers.get('Content-Type', '')!r}；"
                                  f"响应片段：{preview}"
                              )

                          content_type = response.headers.get("Content-Type", "").lower()
                          if "json" not in content_type:
                              preview = response.text[:500].replace("\n", " ")
                              raise RuntimeError(
                                  f"接口返回非 JSON；Content-Type={content_type!r}；"
                                  f"响应片段：{preview}"
                              )
                          try:
                              return response.json()
                          except ValueError as exc:
                              preview = response.text[:500].replace("\n", " ")
                              raise RuntimeError(f"响应 JSON 解析失败：{preview}") from exc
                      except (requests.RequestException, RuntimeError) as exc:
                          last_error = exc
                          if attempt >= 3:
                              break
                          if isinstance(exc, RuntimeError) and "HTTP 429" not in str(exc) and "HTTP 5" not in str(exc):
                              break
                          time.sleep(attempt * 2)
                  raise RuntimeError(f"POST 接口请求失败：{last_error}")

              def fetch_category(self, url):
                  match = re.search(r"[?&]catenum=(\d+)", url)
                  if not match:
                      raise ValueError(f"URL 中没有有效的 catenum：{url}")
                  category_num = match.group(1)
                  description = self.url_descriptions.get(url, url)

                  now = datetime.now(SHANGHAI_TZ)
                  start = now - timedelta(days=30)
                  start_time = start.strftime("%Y-%m-%d 00:00:00")
                  end_time = now.strftime("%Y-%m-%d %H:%M:%S")

                  # 不再 GET 栏目页面：当前运行环境对栏目页 GET 返回 HTTP 405。
                  # 直接 POST 搜索接口；Referer 仍使用当前栏目 URL。

                  all_records = {}
                  seen_page_signatures = set()
                  total_count = None
                  offset = 0
                  page_count = 0

                  while page_count < MAX_PAGES:
                      payload = self.build_payload(
                          category_num, offset, start_time, end_time
                      )
                      data = self.post_api(payload, url)
                      result = data.get("result") if isinstance(data, dict) else None
                      if not isinstance(result, dict):
                          raise ValueError("接口响应缺少 result 对象")

                      raw_records, matched_records = self.parse_response(
                          data, url, page_count + 1
                      )
                      if total_count is None:
                          total_count = self.get_total_count(result)
                      page_count += 1

                      # 防止服务端忽略 pn、反复返回第一页，造成死循环或重复计数。
                      page_signature = hashlib.sha256(
                          json.dumps(raw_records, ensure_ascii=False, sort_keys=True).encode("utf-8")
                      ).hexdigest()
                      if page_signature in seen_page_signatures and raw_records:
                          raise RuntimeError(
                              f"第 {page_count} 页与之前页面完全重复，分页参数 pn={offset} 可能未生效"
                          )
                      seen_page_signatures.add(page_signature)

                      for record in matched_records:
                          all_records[self.record_key(record)] = record

                      print(
                          f"[INFO] {description}：第 {page_count} 页，"
                          f"pn={offset}，原始 {len(raw_records)} 条，"
                          f"关键词匹配 {len(matched_records)} 条，"
                          f"totalcount={total_count if total_count is not None else '未知'}"
                      )

                      if not raw_records:
                          break
                      offset += len(raw_records)

                      if total_count is not None and offset >= total_count:
                          break
                      if len(raw_records) < PAGE_SIZE:
                          break
                  else:
                      if total_count is not None and offset < total_count:
                          raise RuntimeError(
                              f"达到最大分页数 {MAX_PAGES}，但 totalcount={total_count}，"
                              "本栏目数据不完整；为避免覆盖旧状态，本次不保存"
                          )

                  records = sorted(
                      all_records.values(), key=lambda item: (item["title"], item["url"])
                  )
                  print(
                      f"[INFO] {description}：分页 {page_count} 页，"
                      f"关键词匹配去重后 {len(records)} 条"
                  )
                  for record in records[:3]:
                      print(f"       - {record['title']}")

                  serialized = json.dumps(records, ensure_ascii=False, sort_keys=True)
                  content_hash = hashlib.sha256(serialized.encode("utf-8")).hexdigest()
                  return content_hash, records

              @staticmethod
              def normalize_previous_records(old_value):
                  """兼容旧版状态格式：titles 为字符串数组的情况。"""
                  if not isinstance(old_value, dict):
                      return [], None
                  records = old_value.get("records")
                  if isinstance(records, list):
                      normalized = []
                      for item in records:
                          if isinstance(item, dict) and item.get("title"):
                              normalized.append({
                                  "title": str(item["title"]),
                                  "url": str(item.get("url") or ""),
                              })
                      return normalized, old_value.get("hash")

                  titles = old_value.get("titles", [])
                  if isinstance(titles, list):
                      normalized = [
                          {"title": str(title), "url": ""}
                          for title in titles if isinstance(title, str) and title.strip()
                      ]
                      return normalized, old_value.get("hash")
                  return [], old_value.get("hash")

              def find_new_records(self, current_records, previous_records):
                  previous_urls = {
                      item.get("url") for item in previous_records if item.get("url")
                  }
                  previous_titles = {
                      item.get("title", "") for item in previous_records if item.get("title")
                  }
                  new_records = []
                  for item in current_records:
                      title = item.get("title", "")
                      detail_url = item.get("url", "")
                      if detail_url:
                          # 有详情链接时优先按链接识别；兼容旧状态中只有标题的记录。
                          if detail_url not in previous_urls and title not in previous_titles:
                              new_records.append(item)
                      elif title not in previous_titles:
                          new_records.append(item)
                  return new_records

              def send_category_notification(self, url, new_records):
                  if not new_records:
                      return True
                  if not self.webhooks:
                      print("[ERROR] 有新增项目，但 WEBHOOK_URLS 未配置；保留该栏目旧状态以便下次重试")
                      return False

                  description = self.url_descriptions.get(url, "浙江公共资源交易平台")
                  messages = []
                  current_lines = [f"**{description}**", f"关键词：{KEYWORD}", ""]
                  current_length = sum(len(line) for line in current_lines)

                  for record in new_records:
                      title = record["title"].replace("[", "（").replace("]", "）")
                      detail_url = record.get("url") or url
                      line = f"🔴 [{title}]({detail_url})"
                      if current_length + len(line) + 1 > 3500 and len(current_lines) > 3:
                          current_lines.extend(["", f"[查看栏目页面]({url})"])
                          messages.append("\n".join(current_lines))
                          current_lines = [f"**{description}（续）**", f"关键词：{KEYWORD}", ""]
                          current_length = sum(len(item) for item in current_lines)
                      current_lines.append(line)
                      current_length += len(line) + 1

                  current_lines.extend(["", f"[查看栏目页面]({url})"])
                  messages.append("\n".join(current_lines))

                  all_ok = True
                  for webhook_index, webhook in enumerate(self.webhooks, start=1):
                      for message_index, content in enumerate(messages, start=1):
                          try:
                              response = requests.post(
                                  webhook,
                                  json={"msgtype": "markdown", "markdown": {"content": content}},
                                  timeout=20,
                              )
                              response.raise_for_status()
                              result = response.json()
                              if result.get("errcode") != 0:
                                  raise RuntimeError(f"企业微信返回错误：{result}")
                              print(
                                  f"[INFO] 企业微信 Webhook {webhook_index} "
                                  f"消息 {message_index}/{len(messages)} 发送成功"
                              )
                          except Exception as exc:
                              all_ok = False
                              print(f"[ERROR] 企业微信 Webhook {webhook_index} 发送失败：{exc}")
                          time.sleep(1)
                  return all_ok

              def run(self):
                  previous_state = self.load_state()
                  merged_state = dict(previous_state)
                  success_count = 0
                  failure_count = 0
                  notification_failures = 0

                  try:
                      for index, url in enumerate(self.check_urls, start=1):
                          description = self.url_descriptions.get(url, url)
                          print(f"\n[{index}/{len(self.check_urls)}] 检查：{description}")
                          started = time.time()
                          try:
                              current_hash, current_records = self.fetch_category(url)
                              old_records, old_hash = self.normalize_previous_records(
                                  previous_state.get(url)
                              )
                              is_first_baseline = not previous_state.get(url)
                              new_records = [] if is_first_baseline else self.find_new_records(
                                  current_records, old_records
                              )

                              if is_first_baseline:
                                  print("[INFO] 首次建立该栏目的基线，不推送历史存量项目")

                              if new_records:
                                  print(f"[INFO] 检测到新增项目：{len(new_records)} 条")
                                  notification_ok = self.send_category_notification(url, new_records)
                                  if not notification_ok:
                                      notification_failures += 1
                                      print("[WARN] 通知未全部成功，保留该栏目旧状态，下次运行会重试")
                                      continue
                              elif old_hash != current_hash:
                                  print("[INFO] 栏目内容摘要发生变化，但没有新增项目，不发送新增通知")
                              else:
                                  print("[INFO] 没有新增项目")

                              merged_state[url] = {
                                  "hash": current_hash,
                                  "records": current_records,
                              }
                              success_count += 1
                          except Exception as exc:
                              failure_count += 1
                              print(f"[ERROR] 栏目抓取失败，保留原状态：{type(exc).__name__}: {exc}")

                          print(f"[INFO] 本栏目耗时：{time.time() - started:.1f} 秒")
                          if index < len(self.check_urls):
                              time.sleep(1)
                  finally:
                      self.session.close()

                  if success_count > 0:
                      self.save_state(merged_state)
                      print(
                          f"[INFO] 状态文件已保存；成功栏目 {success_count} 个，"
                          f"抓取失败栏目 {failure_count} 个，通知失败栏目 {notification_failures} 个"
                      )
                  else:
                      print("[ERROR] 所有栏目均抓取失败；未修改状态文件")

                  if failure_count == len(self.check_urls) or notification_failures:
                      sys.exit(1)


          if __name__ == "__main__":
              Monitor().run()
          PY

      - name: Commit state file
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- url_state.json; then
            echo "状态文件没有变化，无需提交。"
          else
            git add url_state.json
            git commit -m "Update tender monitor state [skip ci]"
            git push origin HEAD
          fi
