name: Monitor URL Changes

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/monitor.yml'
      - 'url_state.json'
  schedule:
    - cron: '0 23,0-13 * * *'

permissions:
  contents: write

jobs:
  check_url_changes:
    runs-on: ubuntu-latest
    env:
      WEBHOOK_URLS: ${{ secrets.WEBHOOK_URLS }}
      CHECK_URLS: |
        https://ggzy.zj.gov.cn/jyxxgk/list.html?catenum=002001011
        https://ggzy.zj.gov.cn/jyxxgk/list.html?catenum=002001001
        https://ggzy.zj.gov.cn/jyxxgk/list.html?catenum=002001003
        https://ggzy.zj.gov.cn/jyxxgk/list.html?catenum=002001004
        https://ggzy.zj.gov.cn/jyxxgk/list.html?catenum=002001005
      URL_DESCRIPTIONS: |
        {
          "https://ggzy.zj.gov.cn/jyxxgk/list.html?catenum=002001011": "浙江-招标文件公示",
          "https://ggzy.zj.gov.cn/jyxxgk/list.html?catenum=002001001": "浙江-招标公告",
          "https://ggzy.zj.gov.cn/jyxxgk/list.html?catenum=002001003": "浙江-开标结果公示",
          "https://ggzy.zj.gov.cn/jyxxgk/list.html?catenum=002001004": "浙江-中标候选人公示",
          "https://ggzy.zj.gov.cn/jyxxgk/list.html?catenum=002001005": "浙江-中标结果公告"
        }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests beautifulsoup4 urllib3

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Check and notify
        run: |
          python - << "EOF"
          import os, json, hashlib, time, re, requests
          from bs4 import BeautifulSoup
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry
          from playwright.sync_api import sync_playwright

          USER_AGENT = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          STATE_FILE = "url_state.json"
          KEYWORD = "杭州市城市轨道交通"

          class Monitor:
              def __init__(self):
                  self.session = self.create_session()
                  self.url_descriptions = json.loads(os.getenv("URL_DESCRIPTIONS"))
                  self.check_urls = [u.strip() for u in os.getenv("CHECK_URLS").splitlines() if u.strip()]
                  self.base_url = "https://ggzy.zj.gov.cn"

              def create_session(self):
                  session = requests.Session()
                  retry = Retry(
                      total=3,
                      backoff_factor=1,
                      status_forcelist=[429, 500, 502, 503, 504],
                      allowed_methods=['GET']
                  )
                  adapter = HTTPAdapter(max_retries=retry)
                  session.mount('https', adapter)
                  session.mount('http', adapter)
                  return session

              def extract_titles_from_html(self, html):
                  soup = BeautifulSoup(html, 'html.parser')
                  titles_with_links = []
                  for a in soup.select('a.infotitle'):
                      title_text = a.get_text(strip=True)
                      if not title_text or len(title_text) < 5:
                          continue
                      if KEYWORD not in title_text:
                          continue
                      href = a.get('href', '')
                      if not href or href.startswith('javascript'):
                          continue
                      if href.startswith('http'):
                          detail_url = href
                      elif href.startswith('/'):
                          detail_url = f"{self.base_url}{href}"
                      else:
                          detail_url = f"{self.base_url}/jyxxgk/{href.lstrip('/')}"
                      titles_with_links.append((title_text, detail_url))
                  return titles_with_links

              def get_content_hash(self, url, page):
                  try:
                      # 1. 改用 domcontentloaded，先让页面结构加载完
                      page.goto(url, wait_until="domcontentloaded", timeout=60000)
                      # 2. 等待列表容器出现，将超时延长至 30 秒，给动态请求留足时间
                      page.wait_for_selector('#list li.ewb-public-item', timeout=30000)
                      html = page.content()
                      titles_with_links = self.extract_titles_from_html(html)
                      sorted_titles = sorted([title for title, link in titles_with_links])
                      content_for_hash = "\n".join(sorted_titles)
                      return hashlib.sha256(content_for_hash.encode()).hexdigest(), titles_with_links
                  except Exception as e:
                      print(f"[ERROR] 渲染 {url} 失败: {str(e)}")
                      return None, None

              # ... (load_state, save_state, get_new_titles, send_notifications, split_long_message, _send_wechatwork 等函数保持不变)

              def run(self):
                  previous_state = self.load_state()
                  current_state = {}
                  changed_urls = []
                  new_titles_map = {}

                  with sync_playwright() as p:
                      browser = p.chromium.launch(headless=True)
                      # 3. 使用更真实的浏览器上下文
                      context = browser.new_context(
                          user_agent=USER_AGENT,
                          viewport={'width': 1920, 'height': 1080},
                          locale='zh-CN',
                          timezone_id='Asia/Shanghai'
                      )
                      # 4. 注入脚本，隐藏 webdriver 特征
                      context.add_init_script("Object.defineProperty(navigator, 'webdriver', {get: () => undefined})")
                      page = context.new_page()

                      for url in self.check_urls:
                          print(f"\n检查 URL: {url}")
                          current_hash, current_titles = self.get_content_hash(url, page)
                          if current_hash:
                              previous_titles = previous_state.get(url, {}).get("titles", [])
                              new_titles = self.get_new_titles(current_titles, previous_titles)
                              current_state[url] = {
                                  "hash": current_hash,
                                  "titles": [t[0] for t in current_titles]
                              }
                              previous_hash = previous_state.get(url, {}).get("hash")
                              if new_titles or previous_hash != current_hash:
                                  changed_urls.append(url)
                                  new_titles_map[url] = new_titles
                                  print(f"URL {url} 检测到变化: 新增 {len(new_titles)} 个")
                              else:
                                  print(f"URL {url} 未检测到变化")
                          time.sleep(2) # 适当增加栏目间的间隔

                      browser.close()

                  if changed_urls:
                      self.send_notifications(changed_urls, new_titles_map)
                      self.save_state(current_state)
                  else:
                      print("未检测到任何变化")

          if __name__ == "__main__":
              Monitor().run()
          EOF

      - name: Commit and push state file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet url_state.json; then
            echo "No changes detected in url_state.json."
          else
            git add url_state.json
            git commit -m "Update URL states [skip ci]" || echo "No changes to commit."
            git push origin HEAD || echo "Push failed"
            echo "状态文件已更新并提交"
          fi
