name: Monitor URL Changes

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/monitor.yml'
      - 'url_state.json'
  schedule:
    - cron: '0 23,0-13 * * *'  # 每天 23:00、0-13点每小时运行

permissions:
  contents: write

jobs:
  check_url_changes:
    runs-on: ubuntu-latest
    env:
      # 如果你有代理，把下面的注释取消，并填入你的代理地址（例如 socks5://127.0.0.1:1080 或 http://user:pass@ip:port）
      # PROXY_URL: "http://你的代理IP:端口" 
      WEBHOOK_URLS: ${{ secrets.WEBHOOK_URLS }}
      BASE_URL: "https://ggzy.zj.gov.cn/jyxxgk/list.html"
      URL_DESCRIPTIONS: |
        {
          "招标文件公示": "浙江-招标文件公示",
          "招标公告": "浙江-招标公告",
          "开标结果公示": "浙江-开标结果公示",
          "中标候选人公示": "浙江-中标候选人公示",
          "中标结果公告": "浙江-中标结果公告"
        }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests beautifulsoup4 urllib3

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Check and notify
        run: |
          python - << "EOF"
          import os, json, hashlib, time, requests
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright

          USER_AGENT = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          STATE_FILE = "url_state.json"
          KEYWORD = "杭州市城市轨道交通"
          BASE_URL = os.getenv("BASE_URL")
          PROXY_URL = os.getenv("PROXY_URL") # 从环境变量读取代理

          class Monitor:
              def __init__(self):
                  self.url_descriptions = json.loads(os.getenv("URL_DESCRIPTIONS"))
                  self.check_categories = list(self.url_descriptions.keys())

              def get_page_data(self, category_name, page):
                  """模拟点击栏目并获取数据"""
                  try:
                      # 1. 检查页面是否是被 WAF 拦截的 405 页面
                      if "data-spm" in page.content() or "405" in page.title():
                          print(f"[FATAL] 检测到 WAF 拦截 (405)，当前 IP 被封锁，请配置代理！")
                          return None, None

                      # 2. 在左侧菜单中找到对应栏目并点击
                      # 使用文本匹配定位菜单并点击
                      page.locator(f"text='{category_name}'").first.click()
                      
                      # 3. 等待右侧列表的数据刷新出来
                      page.wait_for_selector('a.infotitle', timeout=15000)
                      page.wait_for_timeout(1000) # 稍微等一秒确保数据填充完毕
                      
                      # 4. 提取网页源码并解析
                      html = page.content()
                      soup = BeautifulSoup(html, 'html.parser')
                      
                      titles_with_links = []
                      items = soup.select('a.infotitle')
                      
                      for a in items:
                          title_text = a.get_text(strip=True)
                          # 匹配关键词
                          if KEYWORD in title_text:
                              href = a.get('href', '')
                              if href.startswith('/'):
                                  detail_url = f"https://ggzy.zj.gov.cn{href}"
                              elif href.startswith('http'):
                                  detail_url = href
                              else:
                                  detail_url = BASE_URL
                              titles_with_links.append((title_text, detail_url))

                      sorted_titles = sorted([title for title, link in titles_with_links])
                      content_for_hash = "\n".join(sorted_titles)
                      return hashlib.sha256(content_for_hash.encode()).hexdigest(), titles_with_links

                  except Exception as e:
                      print(f"[ERROR] 提取栏目 '{category_name}' 数据失败: {str(e)}")
                      return None, None

              def load_state(self):
                  try:
                      with open(STATE_FILE, 'r') as f:
                          state = json.load(f)
                  except (FileNotFoundError, json.JSONDecodeError):
                      state = {}
                  for cat in self.check_categories:
                      if cat not in state:
                          state[cat] = {"hash": None, "titles": []}
                  return state

              def save_state(self, state):
                  try:
                      with open(STATE_FILE, 'w') as f:
                          json.dump(state, f, indent=2)
                  except IOError as e:
                      print(f"[ERROR] 保存状态失败: {str(e)}")

              def get_new_titles(self, current_titles, previous_titles):
                  previous_set = set(previous_titles)
                  return [title for title in current_titles if title[0] not in previous_set]

              def send_notifications(self, changed_categories, new_titles_map):
                  markdown_msgs = []
                  for cat in changed_categories:
                      desc = self.url_descriptions.get(cat, cat)
                      new_titles = new_titles_map.get(cat, [])
                      if new_titles:
                          title_links = [f"[{title}]({link})" for title, link in new_titles]
                          title_list = "\n".join([f"🔴 {link}" for link in title_links])
                          message = f"**{desc}**\n{title_list}\n[🔵查看详情]({BASE_URL})"
                          if len(message) > 4000:
                              parts = self.split_long_message(message)
                              markdown_msgs.extend(parts)
                          else:
                              markdown_msgs.append(message)

                  webhook_urls = os.getenv("WEBHOOK_URLS")
                  if webhook_urls and markdown_msgs:
                      try:
                          webhooks = json.loads(webhook_urls)
                          self._send_wechatwork(markdown_msgs, webhooks)
                      except json.JSONDecodeError:
                          print("WEBHOOK_URLS 格式错误")
                  elif not markdown_msgs:
                      print("没有新增数据，跳过通知发送")

              def split_long_message(self, message, max_length=4000):
                  parts = []
                  while len(message) > max_length:
                      split_pos = message.rfind('\n', 0, max_length)
                      if split_pos == -1:
                          split_pos = max_length
                      parts.append(message[:split_pos])
                      message = message[split_pos:]
                  if message:
                      parts.append(message)
                  return parts

              def _send_wechatwork(self, items, webhooks):
                  for webhook in webhooks:
                      for i, item in enumerate(items):
                          data = {"msgtype": "markdown", "markdown": {"content": item}}
                          try:
                              resp = requests.post(webhook['url'], json=data, timeout=15)
                              if resp.status_code == 200 and resp.json().get('errcode') == 0:
                                  print(f"✅ 第 {i+1} 条消息发送成功")
                              else:
                                  print(f"❌ 第 {i+1} 条消息发送失败")
                          except Exception as e:
                              print(f"[ERROR] 企业微信通知异常: {str(e)}")
                          time.sleep(1)

              def run(self):
                  previous_state = self.load_state()
                  current_state = {}
                  changed_categories = []
                  new_titles_map = {}

                  with sync_playwright() as p:
                      # 配置代理
                      launch_args = {"headless": True}
                      if PROXY_URL:
                          print(f"[INFO] 正在使用代理: {PROXY_URL}")
                          launch_args["proxy"] = {"server": PROXY_URL}
                      else:
                          print("[WARNING] 未配置代理，如果被 WAF 拦截将无法获取数据！")

                      browser = p.chromium.launch(**launch_args)
                      context = browser.new_context(
                          user_agent=USER_AGENT,
                          viewport={'width': 1920, 'height': 1080},
                          locale='zh-CN',
                          timezone_id='Asia/Shanghai'
                      )
                      page = context.new_page()
                      
                      # 注入基础反检测
                      page.add_init_script("Object.defineProperty(navigator, 'webdriver', { get: () => undefined });")

                      # 1. 访问一次初始页面
                      print(f"正在加载初始页面: {BASE_URL}")
                      page.goto(BASE_URL, wait_until="domcontentloaded", timeout=40000)
                      
                      # 2. 循环点击五个分类抓取数据
                      for cat in self.check_categories:
                          print(f"\n正在检查栏目: {cat}")
                          start_time = time.time()
                          current_hash, current_titles = self.get_page_data(cat, page)
                          
                          if current_hash:
                              previous_titles = previous_state.get(cat, {}).get("titles", [])
                              new_titles = self.get_new_titles(current_titles, previous_titles)
                              current_state[cat] = {
                                  "hash": current_hash,
                                  "titles": [t[0] for t in current_titles]
                              }
                              previous_hash = previous_state.get(cat, {}).get("hash")
                              
                              if new_titles or previous_hash != current_hash:
                                  changed_categories.append(cat)
                                  new_titles_map[cat] = new_titles
                                  print(f"  -> 检测到变化: 新增 {len(new_titles)} 个")
                              else:
                                  print(f"  -> 未检测到变化")
                          print(f"[DEBUG] 耗时: {time.time() - start_time:.2f} 秒")
                          time.sleep(2)

                      browser.close()

                  if changed_categories:
                      self.send_notifications(changed_categories, new_titles_map)
                      self.save_state(current_state)
                  else:
                      print("未检测到任何变化")

          if __name__ == "__main__":
              Monitor().run()
          EOF

      - name: Commit and push state file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet url_state.json; then
            echo "No changes detected in url_state.json."
          else
            git add url_state.json
            git commit -m "Update URL states [skip ci]" || echo "No changes to commit."
            git push origin HEAD || echo "Push failed"
            echo "状态文件已更新并提交"
          fi
