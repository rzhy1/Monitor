name: Monitor URL Changes

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/monitor.yml'
      - 'url_state.json'
  schedule:
    - cron: '0 23,0-13 * * *'  # 每天 23:00、0-13点每小时运行

permissions:
  contents: write

jobs:
  check_url_changes:
    runs-on: ubuntu-latest
    env:
      WEBHOOK_URLS: ${{ secrets.WEBHOOK_URLS }}
      CHECK_URLS: |
        https://ggzy.zj.gov.cn/jyxxgk/list.html?catenum=002001011
        https://ggzy.zj.gov.cn/jyxxgk/list.html?catenum=002001001
        https://ggzy.zj.gov.cn/jyxxgk/list.html?catenum=002001003
        https://ggzy.zj.gov.cn/jyxxgk/list.html?catenum=002001004
        https://ggzy.zj.gov.cn/jyxxgk/list.html?catenum=002001005
      URL_DESCRIPTIONS: |
        {
          "https://ggzy.zj.gov.cn/jyxxgk/list.html?catenum=002001011": "浙江-招标文件公示",
          "https://ggzy.zj.gov.cn/jyxxgk/list.html?catenum=002001001": "浙江-招标公告",
          "https://ggzy.zj.gov.cn/jyxxgk/list.html?catenum=002001003": "浙江-开标结果公示",
          "https://ggzy.zj.gov.cn/jyxxgk/list.html?catenum=002001004": "浙江-中标候选人公示",
          "https://ggzy.zj.gov.cn/jyxxgk/list.html?catenum=002001005": "浙江-中标结果公告"
        }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests beautifulsoup4 urllib3

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Check and notify
        run: |
          python - << "EOF"
          import os, json, hashlib, time, re, requests
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright

          USER_AGENT = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          STATE_FILE = "url_state.json"
          KEYWORD = "杭州市城市轨道交通"

          class Monitor:
              def __init__(self):
                  self.url_descriptions = json.loads(os.getenv("URL_DESCRIPTIONS"))
                  self.check_urls = [u.strip() for u in os.getenv("CHECK_URLS").splitlines() if u.strip()]
                  self.base_url = "https://ggzy.zj.gov.cn"

              def get_content_hash(self, url, page):
                  catenum_match = re.search(r'catenum=(\d+)', url)
                  if not catenum_match:
                      return None, None
                  catenum = catenum_match.group(1)

                  try:
                      # 1. 设置路由拦截，修改页面自身发出的请求参数，确保拿到正确的分类数据
                      def handle_route(route):
                          if "getFullTextDataNew" in route.request.url:
                              try:
                                  post_data = json.loads(route.request.post_data)
                                  post_data["rn"] = 100 # 确保每页返回100条
                                  if "condition" in post_data:
                                      # 强制修改为当前需要的分类
                                      post_data["condition"][0]["equal"] = catenum
                                  route.continue_(post_data=json.dumps(post_data))
                              except Exception:
                                  route.continue_()
                          else:
                              route.continue_()

                      page.route("**/*getFullTextDataNew*", handle_route)

                      # 2. 使用 expect_response 监听页面自身发出的、返回200的接口请求
                      with page.expect_response(
                          lambda r: "getFullTextDataNew" in r.url and r.status == 200,
                          timeout=30000
                      ) as response_info:
                          # 正常访问页面，浏览器会自动处理所有安全校验
                          page.goto(url, wait_until="domcontentloaded", timeout=60000)

                      # 3. 获取捕获到的合法 JSON 数据
                      response = response_info.value
                      data = response.json()
                      
                      # 取消路由拦截，避免影响后续
                      page.unroute("**/*getFullTextDataNew*")

                      records = data.get("result", {}).get("records", [])
                      titles_with_links = []

                      if not records:
                          print(f"[DEBUG] 接口返回了 0 条数据。")
                      else:
                          print(f"[DEBUG] 接口共返回 {len(records)} 条数据。前 3 条标题示例：")
                          for r in records[:3]:
                              print(f"  - {r.get('titlenew')}")

                      for item in records:
                          raw_title = item.get("titlenew", "")
                          title_text = BeautifulSoup(raw_title, "html.parser").get_text(strip=True)
                          
                          if not title_text or KEYWORD not in title_text:
                              continue
                              
                          detail_url = item.get("linkurl", "")
                          if detail_url:
                              if detail_url.startswith("/"):
                                  detail_url = f"{self.base_url}{detail_url}"
                              elif not detail_url.startswith("http"):
                                  detail_url = f"{self.base_url}/{detail_url}"
                          else:
                              detail_url = url
                              
                          titles_with_links.append((title_text, detail_url))

                      sorted_titles = sorted([title for title, link in titles_with_links])
                      content_for_hash = "\n".join(sorted_titles)
                      return hashlib.sha256(content_for_hash.encode()).hexdigest(), titles_with_links

                  except Exception as e:
                      print(f"[ERROR] 监听页面请求失败 for {url}: {str(e)}")
                      try:
                          page.unroute("**/*getFullTextDataNew*")
                      except Exception:
                          pass
                      return None, None

              # --- 以下为状态管理和通知等辅助方法，保持不变 ---
              def load_state(self):
                  try:
                      with open(STATE_FILE, 'r') as f:
                          state = json.load(f)
                  except (FileNotFoundError, json.JSONDecodeError):
                      state = {}
                  for url in self.check_urls:
                      if url not in state:
                          state[url] = {"hash": None, "titles": []}
                      elif isinstance(state[url], str):
                          state[url] = {"hash": state[url], "titles": []}
                  return state

              def save_state(self, state):
                  try:
                      with open(STATE_FILE, 'w') as f:
                          json.dump(state, f, indent=2)
                  except IOError as e:
                      print(f"[ERROR] 保存状态失败: {str(e)}")

              def get_new_titles(self, current_titles, previous_titles):
                  previous_set = set(previous_titles)
                  new_titles = [title for title in current_titles if title[0] not in previous_set]
                  return new_titles

              def send_notifications(self, changed_urls, new_titles_map):
                  markdown_msgs = []
                  for url in changed_urls:
                      desc = self.url_descriptions.get(url, "未知更新")
                      new_titles = new_titles_map.get(url, [])
                      if new_titles:
                          title_links = [f"[{title}]({link})" for title, link in new_titles]
                          title_list = "\n".join([f"🔴 {link}" for link in title_links])
                          message = f"**{desc}**\n{title_list}\n[🔵查看详情]({url})"
                          if len(message) > 4000:
                              parts = self.split_long_message(message)
                              markdown_msgs.extend(parts)
                          else:
                              markdown_msgs.append(message)
                      else:
                          message = f"**{desc}**\n页面内容有变化，但没有检测到新增项目\n[🔵查看详情]({url})"
                          markdown_msgs.append(message)

                  webhook_urls = os.getenv("WEBHOOK_URLS")
                  if webhook_urls:
                      try:
                          webhooks = json.loads(webhook_urls)
                          self._send_wechatwork(markdown_msgs, webhooks)
                      except json.JSONDecodeError:
                          print("WEBHOOK_URLS 格式错误")
                  else:
                      print("未设置 WEBHOOK_URLS，跳过通知发送")

              def split_long_message(self, message, max_length=4000):
                  parts = []
                  while len(message) > max_length:
                      split_pos = message.rfind('\n', 0, max_length)
                      if split_pos == -1:
                          split_pos = max_length
                      parts.append(message[:split_pos])
                      message = message[split_pos:]
                  if message:
                      parts.append(message)
                  return parts

              def _send_wechatwork(self, items, webhooks):
                  for webhook in webhooks:
                      for i, item in enumerate(items):
                          data = {"msgtype": "markdown", "markdown": {"content": item}}
                          try:
                              resp = requests.post(webhook['url'], json=data, timeout=15)
                              if resp.status_code == 200 and resp.json().get('errcode') == 0:
                                  print(f"✅ 第 {i+1} 条消息发送成功")
                              else:
                                  print(f"❌ 第 {i+1} 条消息发送失败")
                          except Exception as e:
                              print(f"[ERROR] 企业微信通知异常: {str(e)}")
                          time.sleep(1)

              def run(self):
                  previous_state = self.load_state()
                  current_state = {}
                  changed_urls = []
                  new_titles_map = {}

                  with sync_playwright() as p:
                      browser = p.chromium.launch(headless=True)
                      context = browser.new_context(
                          user_agent=USER_AGENT,
                          viewport={'width': 1920, 'height': 1080},
                          locale='zh-CN',
                          timezone_id='Asia/Shanghai'
                      )
                      page = context.new_page()
                      
                      # 注入基础反检测脚本
                      page.add_init_script("""
                          Object.defineProperty(navigator, 'webdriver', { get: () => undefined });
                          Object.defineProperty(navigator, 'languages', { get: () => ['zh-CN', 'zh', 'en'] });
                          Object.defineProperty(navigator, 'plugins', { get: () => [1, 2, 3, 4, 5] });
                      """)

                      for url in self.check_urls:
                          print(f"\n检查 URL: {url}")
                          start_time = time.time()
                          current_hash, current_titles = self.get_content_hash(url, page)
                          if current_hash:
                              previous_titles = previous_state.get(url, {}).get("titles", [])
                              new_titles = self.get_new_titles(current_titles, previous_titles)
                              current_state[url] = {
                                  "hash": current_hash,
                                  "titles": [t[0] for t in current_titles]
                              }
                              previous_hash = previous_state.get(url, {}).get("hash")
                              if new_titles or previous_hash != current_hash:
                                  changed_urls.append(url)
                                  new_titles_map[url] = new_titles
                                  print(f"URL {url} 检测到变化: 新增 {len(new_titles)} 个")
                              else:
                                  print(f"URL {url} 未检测到变化")
                          print(f"[DEBUG] 耗时: {time.time() - start_time:.2f} 秒")
                          time.sleep(2)

                      browser.close()

                  if changed_urls:
                      self.send_notifications(changed_urls, new_titles_map)
                      self.save_state(current_state)
                  else:
                      print("未检测到任何变化")

          if __name__ == "__main__":
              Monitor().run()
          EOF

      - name: Commit and push state file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet url_state.json; then
            echo "No changes detected in url_state.json."
          else
            git add url_state.json
            git commit -m "Update URL states [skip ci]" || echo "No changes to commit."
            git push origin HEAD || echo "Push failed"
            echo "状态文件已更新并提交"
          fi
